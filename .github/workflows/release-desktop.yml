name: Release desktop apps

on:
  push:
    branches: [master]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.changed }}
      previous_sha: ${{ steps.version.outputs.previous_sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - id: version
        name: Detect a version bump
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node .github/scripts/detect-version-change.cjs
      - name: Ensure the version is unreleased
        if: steps.version.outputs.changed == 'true'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${{ steps.version.outputs.version }}"; then
            echo "v${{ steps.version.outputs.version }} already exists" >&2
            exit 1
          fi

  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - name: Install Linux test and packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth rpm fontconfig fonts-dejavu-core libgtk-3-0t64 libnss3 libasound2t64 libgbm1
      - run: npm ci --ignore-scripts
      - name: Install Electron and configure its test sandbox
        run: |
          node node_modules/electron/install.js
          sudo chown root:root node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 node_modules/electron/dist/chrome-sandbox
      - name: Require full runtime coverage
        run: npm run test:coverage:check
      - name: Preserve coverage diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-diagnostics
          path: |
            coverage/coverage-final.json
            coverage/coverage-summary.json
          if-no-files-found: ignore
      - run: npm run desktop:build
      - run: npx electron-builder --linux AppImage deb rpm --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-linux
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.blockmap
            dist/latest-linux.yml
          if-no-files-found: error

  flatpak:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
      - name: Build Flatpak
        run: |
          flatpak-builder --user --repo=flatpak-repo --force-clean \
            --install-deps-from=flathub flatpak-build flatpak/net.paintjs.Paintjs.yml
      - name: Create standalone bundle
        run: |
          mkdir -p dist
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            "dist/paintdotjs-${{ needs.version.outputs.version }}-linux-x86_64.flatpak" \
            net.paintjs.Paintjs master
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-flatpak
          path: dist/*.flatpak
          if-no-files-found: error

  release:
    needs: [version, linux, flatpak]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-artifacts
          merge-multiple: true
      - name: Bundle corresponding codec sources
        run: python3 scripts/package_codec_sources.py release-artifacts/paintdotjs-codec-sources.tar.gz
      - name: Generate release notes
        env:
          PREVIOUS_SHA: ${{ needs.version.outputs.previous_sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if [ -n "$PREVIOUS_SHA" ] && git cat-file -e "${PREVIOUS_SHA}^{commit}" 2>/dev/null; then
            commit_range="${PREVIOUS_SHA}..${GITHUB_SHA}"
            changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${PREVIOUS_SHA}...v${VERSION}"
          else
            previous_tag=$(git describe --tags --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)
            if [ -n "$previous_tag" ]; then
              commit_range="${previous_tag}..${GITHUB_SHA}"
              changelog_url="https://github.com/${GITHUB_REPOSITORY}/compare/${previous_tag}...v${VERSION}"
            else
              commit_range="$GITHUB_SHA"
              changelog_url="https://github.com/${GITHUB_REPOSITORY}/commits/v${VERSION}"
            fi
          fi
          {
            echo '## What changed'
            echo
            git log --reverse --no-merges --pretty='- %s (`%h`)' "$commit_range"
            echo
            echo "**Full Changelog**: ${changelog_url}"
          } > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ needs.version.outputs.version }}" release-artifacts/* \
            --target "$GITHUB_SHA" \
            --title "paint.js ${{ needs.version.outputs.version }}" \
            --notes-file release-notes.md
